<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政务公告排版 - 太原事编通</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #1a73e8, #4285f4);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .editor-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .editor-section h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
        }
        
        .markdown-input {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
        }
        
        .markdown-input:focus {
            outline: none;
            border-color: #1a73e8;
        }
        
        .preview-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .preview-header h2 {
            font-size: 16px;
            color: #333;
        }
        
        .copy-btn {
            padding: 10px 20px;
            background: #c00;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .copy-btn:hover {
            background: #a00;
        }
        
        .copy-btn:active {
            transform: scale(0.98);
        }
        
        .copy-btn.copied {
            background: #34a853;
        }
        
        /* 政务公告样式 - 应用到文章内容 */
        #previewContent {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            line-height: 1.8;
            font-family: "SimSun", "STSong", "宋体", serif;
            color: #000;
        }
        
        #previewContent h1 {
            font-size: 22px;
            color: #000;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            border-left: 4px solid #c00;
            padding-left: 12px;
        }
        
        #previewContent h2 {
            font-size: 16px;
            color: #000;
            margin: 20px 0 10px;
            font-weight: bold;
            border-left: 4px solid #c00;
            padding-left: 10px;
        }
        
        #previewContent h3 {
            font-size: 15px;
            color: #000;
            margin: 14px 0 8px;
            font-weight: bold;
        }
        
        #previewContent p {
            margin-bottom: 10px;
            color: #000;
            text-indent: 2em;
        }
        
        #previewContent strong {
            color: #c00;
        }
        
        #previewContent ul, #previewContent ol {
            margin: 10px 0;
            padding-left: 24px;
        }
        
        #previewContent li {
            margin-bottom: 6px;
        }
        
        #previewContent blockquote {
            border-left: 4px solid #c00;
            padding: 12px 16px;
            margin: 14px 0;
            background: #fff5f5;
            color: #333;
        }
        
        .tips {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
        }
        
        .tips h3 {
            color: #856404;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .tips ul {
            color: #856404;
            font-size: 13px;
            padding-left: 20px;
        }
        
        .tips li {
            margin-bottom: 4px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏛️ 政务公告排版</h1>
            <p>太原事编通 - 一键粘贴，一键复制</p>
        </div>
        
        <div class="editor-section">
            <h2>📝 粘贴你的内容</h2>
            <textarea id="markdownInput" class="markdown-input" placeholder="在这里粘贴你的 Markdown 内容...

支持的格式：
## 一级标题
### 二级标题
**加粗文字**
- 列表项
> 引用内容

示例：
## 太原市XX局关于XX的公告

根据《XX法》相关规定，现将有关事项公告如下：

### 一、XX事项

**主要内容**：XXXXX

### 二、XX要求

- 要求一
- 要求二

### 三、XX时间

> 时间：2024年X月X日 - X月X日

**咨询电话**：0351-XXXXXXX

特此公告。

太原市XX局
2024年X月X日"></textarea>
        </div>
        
        <div class="preview-section">
            <div class="preview-header">
                <h2>👁️ 预览效果</h2>
                <button class="copy-btn" onclick="copyContent()">📋 一键复制到公众号</button>
            </div>
            <div id="previewContent"></div>
        </div>
        
        <div class="tips">
            <h3>💡 使用方法</h3>
            <ul>
                <li><strong>第1步</strong>：在上面粘贴你的 Markdown 内容</li>
                <li><strong>第2步</strong>：看预览效果（自动应用政务公告样式）</li>
                <li><strong>第3步</strong>：点击「一键复制到公众号」按钮</li>
                <li><strong>第4步</strong>：直接粘贴到微信公众号后台</li>
            </ul>
        </div>
    </div>

    <script>
        // Markdown 转 HTML
        function markdownToHtml(markdown) {
            let html = markdown;
            
            // 标题
            html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');
            
            // 加粗
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // 斜体
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            // 代码
            html = html.replace(/`(.*?)`/g, '<code>$1</code>');
            
            // 引用
            html = html.replace(/^> (.*$)/gm, '<blockquote><p>$1</p></blockquote>');
            
            // 列表
            html = html.replace(/^\- (.*$)/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
            
            // 段落
            html = html.replace(/\n\n/g, '</p><p>');
            html = '<p>' + html + '</p>';
            
            // 清理空段落
            html = html.replace(/<p>\s*<\/p>/g, '');
            html = html.replace(/<p>\s*(<h[1-3]>)/g, '$1');
            html = html.replace(/(<\/h[1-3]>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*(<ul>)/g, '$1');
            html = html.replace(/(<\/ul>)\s*<\/p>/g, '$1');
            html = html.replace(/<p>\s*(<blockquote>)/g, '$1');
            html = html.replace(/(<\/blockquote>)\s*<\/p>/g, '$1');
            
            return html;
        }
        
        // 预览更新
        function updatePreview() {
            const input = document.getElementById('markdownInput').value;
            const preview = document.getElementById('previewContent');
            preview.innerHTML = markdownToHtml(input);
            console.log('预览已更新');
        }
        
        // 复制内容
        function copyContent() {
            const preview = document.getElementById('previewContent');
            const html = preview.innerHTML;
            
            // 创建临时元素
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            tempDiv.style.position = 'fixed';
            tempDiv.style.left = '-9999px';
            document.body.appendChild(tempDiv);
            
            // 选中内容
            const range = document.createRange();
            range.selectNodeContents(tempDiv);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            
            // 复制
            try {
                document.execCommand('copy');
                
                // 更新按钮状态
                const btn = document.querySelector('.copy-btn');
                btn.textContent = '✅ 已复制';
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.textContent = '📋 一键复制到公众号';
                    btn.classList.remove('copied');
                }, 2000);
                
                alert('已复制！请直接粘贴到公众号后台');
            } catch (err) {
                alert('复制失败，请手动选择内容复制');
            }
            
            // 清理
            document.body.removeChild(tempDiv);
            selection.removeAllRanges();
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 监听输入
            document.getElementById('markdownInput').addEventListener('input', updatePreview);
            
            // 初始预览
            updatePreview();
        });
    </script>
</body>
</html>
